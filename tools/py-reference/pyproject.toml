[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentid"
version = "0.1.0"
description = "Identity, guardrails, reliability and traceability for software agents — reference implementation"
readme = "README.md"
license = {text = "All rights reserved"}
authors = [
  {name = "Rajat Srivastava", email = "super.agent.universe@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
otel = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-api>=1.25",
]

[project.scripts]
agentid = "agentid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
