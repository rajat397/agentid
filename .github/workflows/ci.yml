name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: core and integration tests
        run: go test ./...
      - name: vet
        run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: frozen oracle suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest
          cd tools/py-reference && python -m pytest -q
      - name: LangChain adapter tests
        run: PYTHONPATH=adapters/langchain python3 -m pytest adapters/langchain/tests -q
      - name: ADK adapter tests
        run: PYTHONPATH=adapters/adk python3 -m pytest adapters/adk/tests -q
      - name: CrewAI adapter tests
        run: PYTHONPATH=adapters/crewai python3 -m pytest adapters/crewai/tests -q
      - name: SK and AutoGen adapter tests
        run: |
          PYTHONPATH=adapters/sk python3 -m pytest adapters/sk/tests -q
          PYTHONPATH=adapters/autogen python3 -m pytest adapters/autogen/tests -q
      - name: cross-language signature verification
        run: |
          go run ./tools/crosstest > /tmp/cross-artifact.json
          python3 tools/py-reference/verify_cross.py /tmp/cross-artifact.json
          go run ./cmd/agentid verify-signed --artifact /tmp/cross-artifact.json
      - name: CLI and evidence smoke
        run: |
          go run ./cmd/agentid demo > /tmp/demo.txt
          grep -q "Four questions" /tmp/demo.txt
          go run ./cmd/agentid evidence export --demo --out /tmp/bundle.json
          go run ./cmd/agentid evidence verify --file /tmp/bundle.json
      - name: optional SQLite adapter
        working-directory: optional/sqlite
        run: go test ./...
