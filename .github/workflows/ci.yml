name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e .[dev]
      - name: test
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q
      - name: demo smoke test
        run: |
          . .venv/bin/activate
          agentid demo > /tmp/demo_out.txt
          agentid version
          grep -q "Which agent" /tmp/demo_out.txt
