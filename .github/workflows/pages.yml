name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - playground/**
      - scripts/**
      - internal/**
      - cmd/**
      - go.mod
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sync real CLI captures
        run: bash scripts/sync-playground-captures.sh
      - name: build playground
        working-directory: playground
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then
              echo "github-pages artifact visible"
              exit 0
            fi
            sleep 10
          done
          echo "github-pages artifact metadata did not become visible" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
