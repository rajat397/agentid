name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@v3
      - name: Build release artifacts
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}" dist/release
      - name: Sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/release/SHA256SUMS.sigstore.json dist/release/SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/rajat397/agentid:${{ github.ref_name }}
            ghcr.io/rajat397/agentid:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Sign container image
        env:
          IMAGE: ghcr.io/rajat397/agentid
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/release/agentid_* dist/release/SHA256SUMS dist/release/SHA256SUMS.sigstore.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
          fi
